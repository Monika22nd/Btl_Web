{% extends "base.html" %}
{% block title %}Quản lý thương hiệu - TechWorld{% endblock %}
{% block content %}
<section class="container admin-shell">
  <form class="admin-form" action="/admin/brands/new" method="post">
    <h1>Thương hiệu</h1>
    {% if error %}<p class="empty-state">{{ error }}</p>{% endif %}
    <label>Tên thương hiệu</label><input name="name" required>
    <label>Slug</label><input name="slug" required>
    <button class="btn btn-primary" type="submit">Thêm thương hiệu</button>
  </form>
  <div class="admin-table">
    <table>
      <thead><tr><th>Tên</th><th>Slug</th></tr></thead>
      <tbody>{% for brand in brands %}<tr><td>{{ brand.name }}</td><td>{{ brand.slug }}</td></tr>{% endfor %}</tbody>
    </table>
  </div>
</section>
{% endblock %}
